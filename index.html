<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A sleek and interactive modern demo web page built with HTML, CSS, and JavaScript.">
  <title>Antigravity Modern Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    .container {
      max-width: 800px;
      width: 100%;
      text-align: center;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 60px rgba(99, 102, 241, 0.2);
    }

    .badge {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 1.125rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.875rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .counter-box {
      margin-top: 2rem;
      padding-top: 2rem;
      border-top: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .counter-val {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    footer {
      margin-top: 3rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="glass-card">
      <span class="badge" id="demo-badge">🚀 Interactive Demo</span>
      <h1 id="main-title">Welcome to Onmysite</h1>
      <p id="main-desc">
        This is a sleek, modern HTML demo page created automatically with responsive styling, smooth gradients, and interactive components.
      </p>

      <div class="actions">
        <button class="btn btn-primary" id="btn-click">Click Me!</button>
        <button class="btn btn-secondary" id="btn-reset">Reset</button>
      </div>

      <div class="counter-box">
        <span style="color: var(--text-muted); font-size: 0.875rem;">Total Clicks</span>
        <div class="counter-val" id="counter">0</div>
      </div>
    </main>

    <footer>
      Built with ❤️ by Antigravity
    </footer>
  </div>

  <script>
    const btnClick = document.getElementById('btn-click');
    const btnReset = document.getElementById('btn-reset');
    const counterDisplay = document.getElementById('counter');
    let count = 0;

    btnClick.addEventListener('click', () => {
      count++;
      counterDisplay.textContent = count;
      counterDisplay.style.transform = 'scale(1.2)';
      setTimeout(() => {
        counterDisplay.style.transform = 'scale(1)';
      }, 150);
    });

    btnReset.addEventListener('click', () => {
      count = 0;
      counterDisplay.textContent = count;
    });
  </script>
</body>
</html>
